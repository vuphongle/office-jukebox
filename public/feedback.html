<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Góp ý · Quản trị</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/feedback.css" />
</head>
<body>
  <main class="feedback-admin">
    <a class="back-link" href="/">← Về trang máy chiếu</a>
    <header class="page-head">
      <div class="page-head-copy">
        <img class="feedback-brand-logo" src="/assets/logo.png" alt="Laztar" />
        <div>
          <p class="eyebrow">Quản trị</p>
          <h1>Góp ý từ khách</h1>
          <p class="intro">Theo dõi ý tưởng, báo lỗi và những điều khách muốn cải thiện.</p>
        </div>
      </div>
      <div class="page-head-actions" aria-label="Cài đặt tính năng khách">
        <button id="feedback-toggle" class="toggle" type="button" aria-pressed="true">Góp ý: Bật</button>
        <button id="chat-toggle" class="toggle" type="button" aria-pressed="true">Chat: Bật</button>
        <button id="chat-clear" class="toggle clear-toggle" type="button">Xóa tin nhắn</button>
      </div>
    </header>

    <div id="page-status" class="page-status" role="status" aria-live="polite"></div>
    <section class="stats" aria-label="Thống kê góp ý">
      <article><strong id="stat-total">—</strong><span>Tổng góp ý</span></article>
      <article><strong id="stat-today">—</strong><span>Trong hôm nay</span></article>
      <article><strong id="stat-week">—</strong><span>7 ngày qua</span></article>
    </section>

    <section class="admin-chat-card" aria-labelledby="admin-chat-title">
      <div class="admin-chat-head">
        <div>
          <p class="eyebrow">Phòng chat</p>
          <h2 id="admin-chat-title">Chat với khách</h2>
          <p class="admin-chat-intro">Tin nhắn của admin có nhãn nổi bật để khách dễ nhận ra.</p>
        </div>
        <span class="admin-badge" aria-label="Tin nhắn admin">ADMIN</span>
      </div>
      <div id="admin-chat-messages" class="admin-chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      <form id="admin-chat-form" class="admin-chat-form">
        <div class="admin-chat-fields">
          <label for="admin-chat-name">Tên admin</label>
          <input id="admin-chat-name" type="text" maxlength="40" autocomplete="name" value="Admin" />
        </div>
        <div class="admin-chat-compose">
          <label class="sr-only" for="admin-chat-message">Nội dung chat</label>
          <input id="admin-chat-message" type="text" maxlength="280" autocomplete="off" enterkeyhint="send" placeholder="Nhắn điều gì đó cho khách…" />
          <button id="admin-chat-send" type="submit" aria-label="Gửi tin nhắn admin">Gửi</button>
        </div>
        <p id="admin-chat-status" class="admin-chat-status" role="status" aria-live="polite">Đang kết nối phòng chat…</p>
      </form>
    </section>

    <section class="feedback-list-card">
      <div class="list-head"><h2>Danh sách góp ý</h2><span id="list-count"></span></div>
      <div id="feedback-list" class="feedback-list"></div>
    </section>
  </main>
  <script src="/feedback.js"></script>
</body>
</html>
