services:
  event-music:
    build: .
    container_name: event-music
    restart: unless-stopped

    # Tham gia mạng của reverse proxy để proxy định tuyến tới container theo tên
    # (event-music:45416). Proxy xử lý TLS và phục vụ domain công khai.
    networks:
      - reverseproxy
    expose:
      - "${PORT:-45416}"

    # Cài đặt trang host (bộ lọc/chế độ/thời gian chờ/bối cảnh sự kiện) được lưu
    # tại đây qua các lần xây dựng lại và khởi động lại.
    volumes:
      - ./data:/app/data

    env_file:
      - .env
    environment:
      PORT: ${PORT:-45416}
      # Địa chỉ công khai mà mã QR trỏ tới (domain của reverse proxy).
      PUBLIC_URL: ${PUBLIC_URL:-}

networks:
  reverseproxy:
    external: true
