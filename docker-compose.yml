services:
  event-music:
    build: .
    container_name: event-music
    restart: unless-stopped

    # Join the reverse-proxy network so it can route to the container by name
    # (event-music:45416). The proxy handles TLS and serves the public domain.
    networks:
      - reverseproxy
    expose:
      - "${PORT:-45416}"

    # Persist SQLite, the queue, and event settings across rebuilds and restarts.
    volumes:
      - ./data:/app/data

    env_file:
      - .env
    environment:
      PORT: ${PORT:-45416}
      # Public address targeted by the QR code (the reverse-proxy domain).
      PUBLIC_URL: ${PUBLIC_URL:-}

networks:
  reverseproxy:
    external: true
